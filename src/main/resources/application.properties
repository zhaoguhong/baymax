# 公共配置。未指定 profile 时使用本地开发配置。
spring.application.name=baymax
spring.profiles.default=dev

spring.cache.redis.key-prefix=baymax
spring.jpa.open-in-view=false
logging.file.name=${LOG_FILE:log/baymax.log}

# 项目仅使用 MongoTemplate/RedisTemplate，不启用对应的 Repository 扫描。
spring.data.mongodb.repositories.type=none
spring.data.redis.repositories.enabled=false

#邮件
mail.sender=${MAIL_SENDER:}

# actuator端口 默认应用端口
# management.server.port=8082
# 只暴露必要的端点，避免敏感信息泄露
management.endpoints.web.exposure.include=health,info,metrics
# actuator路径前缀，默认 /actuator
management.endpoints.web.base-path=/actuator

#自定义登录页面
security.login-page=/login.html
#自定义登录请求路径
security.login-processing-url=/login

#是否开启单点登录
cas.enable=false

# mybatis
# 配置文件位置 classpath后面要加*，不然后面通配符不管用
mybatis.mapper-locations=classpath*:com/zhaoguhong/baymax/*/mapper/*Mapper.xml
# 开启驼峰命名自动映射
mybatis.configuration.map-underscore-to-camel-case=true

# 通用 Mapper 5 会通过 @RegisterMapper 自动发现官方基础接口。
# MyMapper 中包含 Java default 方法，不能再作为 SQL Provider 接口配置到 mapper.mappers。
mapper.not-empty=false
mapper.identity=MYSQL

#pagehelper
#指定数据库类型
pagehelper.helper-dialect=mysql
#分页合理化参数
pagehelper.reasonable=true
