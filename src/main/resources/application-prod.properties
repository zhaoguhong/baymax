# 生产环境配置。敏感信息只从环境变量读取，不提供默认密码。
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.druid.stat-view-servlet.login-username=${DRUID_USERNAME}
spring.datasource.druid.stat-view-servlet.login-password=${DRUID_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

spring.data.mongodb.uri=${MONGODB_URI}

spring.mail.host=${MAIL_HOST}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
mail.sender=${MAIL_SENDER}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

security.anonymous=/actuator/health

cas.enable=${CAS_ENABLED:false}
cas.server-url=${CAS_SERVER_URL:}
cas.client-url=${CAS_CLIENT_URL:}
cas.login-url=${CAS_LOGIN_URL:${cas.server-url}/login}
cas.server-logout-url=${CAS_SERVER_LOGOUT_URL:${cas.server-url}/logout}
cas.client-cas-url=${CAS_CLIENT_CAS_URL:${cas.client-url}/login/cas}
