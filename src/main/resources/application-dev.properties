# 本地开发配置
spring.datasource.url=jdbc:mysql://localhost:3306/baymax?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.druid.stat-view-servlet.login-username=${DRUID_USERNAME:admin}
spring.datasource.druid.stat-view-servlet.login-password=${DRUID_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/test}

spring.mail.host=${MAIL_HOST:smtp.163.com}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 本地演示接口和 Druid 控制台允许匿名访问。
security.anonymous=/test/**,/anon/**,/actuator/health,/druid/**

cas.enable=${CAS_ENABLED:false}
cas.server-url=${CAS_SERVER_URL:}
cas.client-url=${CAS_CLIENT_URL:}
cas.login-url=${CAS_LOGIN_URL:${cas.server-url}/login}
cas.server-logout-url=${CAS_SERVER_LOGOUT_URL:${cas.server-url}/logout}
cas.client-cas-url=${CAS_CLIENT_CAS_URL:${cas.client-url}/login/cas}
